[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "botsim"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "networkx",
    "pandas",
    "matplotlib",
    "scipy",
    "pyyaml"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]